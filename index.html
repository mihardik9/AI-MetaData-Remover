<html lang="en" class="scroll-smooth">

    <!-- Structured Data (JSON-LD) for Google Search and AI Assistants (ChatGPT, Claude, Perplexity) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "AI Metadata Remover",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript. Requires HTML5 Canvas.",
      "description": "A privacy-first web tool to inspect and strip AI metadata, generation prompts, C2PA Content Credentials, and EXIF tags from images generated by Midjourney, Stable Diffusion, DALL-E, and Flux while preserving 100% visual quality.",

        "100% Lossless quality preservation",
        "Removes Stable Diffusion & ComfyUI parameters and prompts",
        "Purges C2PA and JUMBF Content Credentials manifests",
        "Strips Midjourney and DALL-E generation tags",
        "Zero server upload - 100% private browser-based processing",
        "Day and Night Mode theme toggle"
      ],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Initialize dark mode before paint to prevent flash
      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}
    </script>

  <body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 antialiased selection:bg-neutral-900 dark:selection:bg-neutral-100 selection:text-white dark:selection:text-neutral-950 transition-colors duration-200">
